<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giải Pickleball</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Giải Pickleball">
<meta name="theme-color" content="#047857">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#ecfdf5',
            100: '#d1fae5',
            500: '#10b981',
            600: '#059669',
            700: '#047857',
            900: '#064e3b',
          },
          gold: {
            400: '#fbbf24',
            500: '#f59e0b',
            600: '#d97706',
          }
        }
      }
    }
  }
</script>
<style>
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
  }
  .dark {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }
  button { touch-action: manipulation; cursor: pointer; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .hidden { display: none !important; }
  .modal-backdrop { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); }
</style>
</head>
<body class="min-h-screen pb-12 transition-colors duration-200">
<main class="max-w-4xl mx-auto px-3 sm:px-4 pt-4">
  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 text-sm flex items-center gap-2 pointer-events-none">
    <span id="toast-icon">ℹ️</span>
    <span id="toast-msg"></span>
  </div>

  <!-- Modal Đăng Nhập Admin -->
  <div id="pass-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
    <div class="bg-card w-full max-w-sm rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
      <div class="text-center">
        <div class="text-3xl mb-2">🔐</div>
        <h3 class="font-extrabold text-lg text-slate-800 dark:text-slate-100">Đăng Nhập Ban Tổ Chức</h3>
        <p class="text-sm text-slate-500 mt-1">Nhập thông tin để quản trị giải đấu</p>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-sm font-medium text-slate-600 dark:text-slate-400 block mb-1">Tên người dùng</label>
          <input type="text" id="admin-name" placeholder="Tên BTC / Trọng tài" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-center outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="text-sm font-medium text-slate-600 dark:text-slate-400 block mb-1">Mật khẩu Admin</label>
          <input type="password" id="pass-input" placeholder="Nhập mật khẩu..." class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-center text-lg font-bold outline-none focus:ring-2 focus:ring-brand-500">
          <div id="pass-error" class="text-xs text-red-500 font-bold text-center mt-1.5 hidden">Mật khẩu không chính xác!</div>
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button id="pass-cancel" class="flex-1 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-sm rounded-xl">Hủy</button>
        <button id="pass-submit" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-bold text-sm rounded-xl shadow">Xác nhận</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-gradient-to-r from-brand-700 via-brand-600 to-teal-700 text-white p-4 sm:p-6 rounded-2xl shadow-xl mb-4">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
      <div class="flex items-center gap-3 flex-1 min-w-[240px]">
        <span class="bg-white/10 p-2 rounded-2xl shadow-inner">🏸</span>
        <div class="flex-1">
          <span class="text-xs uppercase tracking-wider text-emerald-200 font-bold block mb-1">GIẢI ĐẤU PICKLEBALL</span>
          <h1 class="text-2xl sm:text-3xl font-bold m-0">Quản Lý Giải Đấu</h1>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-admin-toggle" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold text-sm px-4 py-2 rounded-xl transition-all shadow-md">
          🔐 Vào BTC
        </button>
        <button id="btn-theme" class="bg-white/20 hover:bg-white/30 p-2 rounded-xl border border-white/20">🌙</button>
      </div>
    </div>
    <div class="text-sm text-emerald-100">
      <span id="role-display">Chưa đăng nhập -- Chỉ xem</span>
    </div>
  </header>

  <!-- Nội dung chính -->
  <div class="bg-card dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
    <h2 class="text-xl font-bold mb-4">👋 Chào Mừng</h2>
    <p class="mb-4">Để bắt đầu quản lý giải đấu, nhấn nút <strong>🔐 Vào BTC</strong> ở góc trên bên phải.</p>
    <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-lg p-4 text-sm">
      <p class="font-bold text-amber-800 dark:text-amber-300">ℹ️ Thông tin đăng nhập mặc định:</p>
      <p class="text-amber-700 dark:text-amber-400 mt-1">• Mật khẩu: <code class="bg-amber-100 dark:bg-amber-800/50 px-2 py-0.5 rounded">1234</code></p>
    </div>
  </div>
</main>

<script>
// ============================================================
// CẤU HÌNH
// ============================================================
const ADMIN_PASSWORD = '1234'; // ⚠️ Đổi mật khẩu ở đây nếu cần

// ============================================================
// HIỂN THỊ THÔNG BÁO
// ============================================================
function showToast(msg, icon = 'ℹ️') {
  const toast = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-icon').textContent = icon;
  toast.classList.remove('translate-y-20', 'opacity-0');
  setTimeout(() => {
    toast.classList.add('translate-y-20', 'opacity-0');
  }, 3000);
}

// ============================================================
// ĐĂNG NHẬP ADMIN
// ============================================================
const passModal = document.getElementById('pass-modal');
const adminNameInput = document.getElementById('admin-name');
const passInput = document.getElementById('pass-input');
const passError = document.getElementById('pass-error');
const passSubmit = document.getElementById('pass-submit');
const passCancel = document.getElementById('pass-cancel');
const btnAdminToggle = document.getElementById('btn-admin-toggle');
const roleDisplay = document.getElementById('role-display');

// Mở form đăng nhập
btnAdminToggle.addEventListener('click', function() {
  passModal.classList.remove('hidden');
  adminNameInput.value = '';
  passInput.value = '';
  passError.classList.add('hidden');
  adminNameInput.focus();
});

// Đóng form đăng nhập
passCancel.addEventListener('click', function() {
  passModal.classList.add('hidden');
});

// Xử lý đăng nhập
passSubmit.addEventListener('click', function() {
  const name = adminNameInput.value.trim();
  const pass = passInput.value;
  
  if (!name) {
    passError.textContent = 'Vui lòng nhập tên người dùng';
    passError.classList.remove('hidden');
    return;
  }
  
  if (pass === ADMIN_PASSWORD) {
    // Đăng nhập thành công
    passModal.classList.add('hidden');
    roleDisplay.textContent = '✅ Đăng nhập với quyền Admin -- ' + name;
    btnAdminToggle.textContent = '✅ Đã đăng nhập';
    btnAdminToggle.classList.remove('bg-amber-400', 'hover:bg-amber-300');
    btnAdminToggle.classList.add('bg-emerald-500', 'cursor-default');
    showToast('Đăng nhập thành công!', '✅');
    sessionStorage.setItem('admin_name', name);
    sessionStorage.setItem('admin_logged', 'true');
  } else {
    passError.textContent = 'Mật khẩu không chính xác!';
    passError.classList.remove('hidden');
    passInput.value = '';
    passInput.focus();
  }
});

// Đổi chế độ sáng/tối
const btnTheme = document.getElementById('btn-theme');
btnTheme.addEventListener('click', function() {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
});

// Khôi phục chế độ tối
if (localStorage.getItem('darkMode') === 'true') {
  document.documentElement.classList.add('dark');
}
</script>
</body>
</html>
