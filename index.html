function showToast(msg, icon = 'ℹ️') {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').innerText = msg;
  document.getElementById('toast-icon').innerText = icon;
  el.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
  setTimeout(() => el.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none'), 3000);
}

function showConfirm(title, desc, icon = '⚠️') {
  return new Promise(resolve => {
    document.getElementById('confirm-title').innerText = title;
    document.getElementById('confirm-desc').innerText = desc;
    document.getElementById('confirm-icon').innerText = icon;
    document.getElementById('confirm-modal').classList.remove('hidden');
    const okBtn = document.getElementById('confirm-ok');
    const cancelBtn = document.getElementById('confirm-cancel');
    const cleanup = () => {
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      document.getElementById('confirm-modal').classList.add('hidden');
    };
    function onOk() { cleanup(); resolve(true); }
    function onCancel() { cleanup(); resolve(false); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('Đã sao chép liên kết!', '📋'));
  } else {
    const t = document.createElement('textarea'); t.value = text;
    document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
    showToast('Đã sao chép liên kết!', '📋');
  }
}

function e(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]); }
const GN = k => 'ABCDEFGH'[k];
const T = i => {
  const d = S.teamDetails[i] || {};
  return d.displayName || S.teams[i] || 'Đội ' + (i + 1);
};
