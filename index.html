<script>
const KEY = 'pb-tournament-v8';
const BALL = '<svg viewBox="0 0 24 24" style="display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.2em" aria-hidden="true"><circle cx="12" cy="12" r="10.6" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/><g fill="#b45309"><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="6.4" r="1.5"/><circle cx="12" cy="17.6" r="1.5"/><circle cx="7.2" cy="9.2" r="1.5"/><circle cx="16.8" cy="9.2" r="1.5"/><circle cx="7.2" cy="14.8" r="1.5"/><circle cx="16.8" cy="14.8" r="1.5"/><circle cx="4.9" cy="12" r="1"/><circle cx="19.1" cy="12" r="1"/></g></svg>';
const DEFAULT_DB = 'https://pickleball-34cb5-default-rtdb.asia-southeast1.firebasedatabase.app';

const def = () => ({
  name: 'Giải Pickleball Mở Rộng',
  adminPass: '1234',
  date: '',
  loc: '',
  mode: 'double',
  g: 2,
  sizes: [4, 4],
  pool: [],
  ord: [],
  courts: 2,
  mins: 20,
  tstart: '',
  advA: 2,
  advB: 2,
  rules: {
    rr: { pts: 11, w2: true },
    ko: { pts: 11, w2: true },
    f:  { pts: 15, w2: true }
  },
  notes: '',
  started: false,
  teams: [],
  tg: [],
  matches: [],
  ko: { A: {}, B: {} },
  manualRank: {},
  db: DEFAULT_DB,
  tid: ''
});

function rd(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(x) { return null; } }

let S = def(), SC = {}, tab = 'sched', armed = false, err = '', ADMIN = false, MODE = 'view', pendingConfirm = null, OPEN = {};
let POSEDIT = false, PRE = {}, RESTART_ARM = {};
let SYNC = { db: '', tid: '' }, DIRTY = {}, SYNC_OK = null, SNAP_RT = null, HIST = {};
let STORE = KEY, SHARED = false, SNAP_T = 0, SNAP_ERR = false, CH = {}, ROUTED = false;

function showToast(msg, icon = 'ℹ️') {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').innerText = msg;
  document.getElementById('toast-icon').innerText = icon;
  el.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
  setTimeout(() => {
    el.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
  }, 3000);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('Đã sao chép liên kết vào bộ nhớ tạm!', '📋'))
    .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const input = document.createElement('textarea');
  input.value = text;
  document.body.appendChild(input);
  input.select();
  try {
    document.execCommand('copy');
    showToast('Đã sao chép liên kết!', '📋');
  } catch (err) {
    showToast('Vui lòng sao chép thủ công: ' + text, '⚠️');
  }
  document.body.removeChild(input);
}

function getBaseUrl() {
  const loc = window.location.href;
  const idx = loc.indexOf('#');
  const qIdx = loc.indexOf('?');
  let clean = loc;
  if (idx !== -1) clean = clean.substring(0, idx);
  if (qIdx !== -1) clean = clean.substring(0, qIdx);
  return clean;
}

// -------------------------------------------------------------
// CHIA SẺ DỮ LIỆU QUA LINK (không cần máy chủ)
// Dữ liệu giải được nén gọn và nhúng thẳng vào tham số ?d=... của link,
// nên trọng tài / VĐV mở link trên máy khác (Zalo) vẫn thấy đủ trận đấu.
// -------------------------------------------------------------
function b64enc(o) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64dec(str) {
  str = String(str).trim().replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  return JSON.parse(decodeURIComponent(escape(atob(str))));
}

function snapObj(withSC) {
  return {
    v: 1, t: Date.now(),
    n: S.name, dt: S.date, lc: S.loc, md: S.mode, g: S.g, ad: S.advA, bd: S.advB,
    r: S.rules, nt: S.notes, c: S.courts, ns: S.nslots,
    tm: S.teams, tg: S.tg, mr: S.manualRank,
    m: S.matches.map(m => [m.g, m.a, m.b, m.r, m.slot, m.court, m.ref || '']),
    SC: withSC ? SC : undefined
  };
}
function snapParam() { return b64enc(snapObj(true)); }

// Tham số đồng bộ gắn vào link (nếu BTC đã bật đồng bộ)
function syncQS() { return syncOn() ? `&db=${encodeURIComponent(SYNC.db)}&tid=${encodeURIComponent(SYNC.tid)}` : ''; }

function fromSnap(p) {
  const s = def();
  s.name = p.n; s.date = p.dt; s.loc = p.lc; s.mode = p.md; s.g = p.g;
  s.advA = p.ad; s.advB = p.bd; s.rules = p.r; s.notes = p.nt || ''; s.courts = p.c;
  s.teams = p.tm; s.tg = p.tg; s.nslots = p.ns; s.manualRank = p.mr || {};
  s.started = true;
  s.adminPass = '\u0000' + Math.random(); // link chia sẻ không chứa mật khẩu Admin
  s.matches = p.m.map(a => ({ g: a[0], a: a[1], b: a[2], r: a[3], slot: a[4], court: a[5], ref: a[6] || undefined, sa: null, sb: null }));
  s.sizes = [...Array(s.g).keys()].map(k => s.tg.filter(x => x === k).length);
  return s;
}

// Tải dữ liệu 1 lần khi mở trang
(function loadData() {
  const params = new URLSearchParams(window.location.search);
  const d = params.get('d');
  let loaded = false;
  if (params.get('db') && params.get('tid')) {
    SYNC = { db: params.get('db'), tid: params.get('tid') };
    if (!d) { SHARED = true; STORE = KEY + '-shared'; loaded = true; S = def(); S.adminPass = '\u0000' + Math.random(); }
  }
  if (d) {
    try {
      const p = b64dec(d);
      SHARED = true;
      STORE = KEY + '-shared';
      SNAP_T = p.t;
      const sv = rd(STORE);
      if (sv && sv.t === p.t && sv.S) {         // cùng link -> giữ điểm trọng tài đã chấm
        S = Object.assign(def(), sv.S);
        SC = sv.SC || {};
        CH = sv.CH || {};
      } else {                                   // link mới -> dùng dữ liệu trong link
        S = fromSnap(p);
        SC = p.SC || {};
        CH = {};
      }
      loaded = true;
    } catch (x) {
      SNAP_ERR = true;
    }
  }
  if (!loaded) {
    const saved = rd(KEY);
    if (saved && saved.S) {
      S = Object.assign(def(), saved.S);
      SC = saved.SC || {};
    }
  }
  if (!SHARED) {
    if (!S.db && !S.dbOff) S.db = DEFAULT_DB;
    if (S.db && !S.tid) S.tid = Math.random().toString(36).slice(2, 10);
    SYNC = { db: S.db || '', tid: S.tid || '' };
    persistLocal();
  }
})();

// -------------------------------------------------------------
// ĐỒNG BỘ ĐIỂM TỰ ĐỘNG QUA FIREBASE REALTIME DATABASE (REST)
// -------------------------------------------------------------
const syncOn = () => !!(SYNC.db && SYNC.tid);
const dbBase = () => SYNC.db.replace(/\/+$/, '') + '/t/' + encodeURIComponent(SYNC.tid);
async function dbReq(path, method, body) {
  const url = dbBase() + path + '.json' + (method === 'GET' ? '?_=' + Date.now() : '');
  const r = await fetch(url, body !== undefined ? { method, body: JSON.stringify(body) } : { method });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function updateBadge() {
  const el = document.getElementById('role-badge');
  if (!el) return;
  const base = MODE === 'admin' ? 'Quyền Admin (BTC)' : MODE === 'referee' ? 'Bàn Trọng Tài' : 'Quyền Xem VĐV';
  el.innerText = base + (syncOn() ? (SYNC_OK === false ? ' · 🔴 Mất kết nối' : ' · 🟢 Đồng bộ') : '');
}
function setSync(ok) {
  if (SYNC_OK !== ok) { SYNC_OK = ok; updateBadge(); if (MODE === 'referee') render(); }
}
function pushScore(id) {
  if (!syncOn() || !SC[id]) return Promise.resolve();
  return dbReq('/sc/' + id, 'PUT', SC[id]).then(() => { delete DIRTY[id]; setSync(true); }).catch(() => { DIRTY[id] = 1; setSync(false); });
}
// Nhận điểm tức thì (Server-Sent Events của Firebase), có polling dự phòng
let ES = null;
function mergeRemote(id, rv) {
  if (!rv || typeof rv !== 'object') return false;
  const lv = SC[id];
  if (!lv || (rv.ts || 0) > (lv.ts || 0)) { SC[id] = rv; return true; }
  return false;
}
function onStream(ev) {
  let d; try { d = JSON.parse(ev.data); } catch (x) { return; }
  if (!d) return;
  const seg = String(d.path || '/').split('/').filter(Boolean);
  let ch = false;
  if (seg.length === 0) {
    Object.keys(d.data || {}).forEach(id => { if (mergeRemote(id, d.data[id])) ch = true; });
  } else if (seg.length === 1) {
    ch = mergeRemote(seg[0], d.data);
  }
  setSync(true);
  if (ch) {
    applyScores(); persistLocal();
    const ae = document.activeElement;
    if (!(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render();
  }
}
function startStream() {
  if (!syncOn() || typeof EventSource === 'undefined') return;
  const url = dbBase() + '/sc.json';
  if (ES && ES.__url === url) return;
  if (ES) ES.close();
  try {
    ES = new EventSource(url);
    ES.__url = url;
    ES.addEventListener('put', onStream);
    ES.addEventListener('patch', onStream);
    ES.onopen = () => setSync(true);
  } catch (x) { ES = null; }
}

let snapTimer = null;
function pushSnapSoon() {
  if (!syncOn() || SHARED) return;
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => { dbReq('/snap', 'PUT', snapObj(false)).then(() => setSync(true)).catch(() => setSync(false)); }, 800);
}
async function pull() {
  if (!syncOn()) return;
  try {
    for (const id of Object.keys(DIRTY)) await pushScore(id);
    const r = (await dbReq('/sc', 'GET')) || {};
    if (!SHARED) Object.keys(SC).forEach(id => { if (!r[id]) pushScore(id); });
    let ch = false;
    if (SHARED) {
      const rt = await dbReq('/snap/t', 'GET');
      if (rt && rt !== SNAP_RT) {
        const p = await dbReq('/snap', 'GET');
        if (p) {
          const keep = {};
          Object.keys(DIRTY).forEach(id => { if (SC[id]) keep[id] = SC[id]; });
          S = fromSnap(p); fit();
          SC = Object.assign({}, r, keep);
          SNAP_RT = rt; ch = true;
        }
      }
    }
    Object.keys(r).forEach(id => {
      const lv = SC[id], rv = r[id];
      if (!lv || (rv.ts || 0) > (lv.ts || 0)) { SC[id] = rv; ch = true; }
    });
    setSync(true);
    if (ch) {
      applyScores(); persistLocal();
      const ae = document.activeElement;
      if (!(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render();
    }
  } catch (x) { setSync(false); }
}

// Xác định vai trò (Admin / Trọng tài / Xem) dựa trên URL
function parseRoute() {
  const hash = window.location.hash || '';
  const params = new URLSearchParams(window.location.search);
  const roleParam = params.get('role');
  const refW = params.get('ref_w');

  if (refW != null || roleParam === 'referee' || hash.startsWith('#referee-')) {
    ADMIN = false;
    MODE = 'referee';
    if (!ROUTED) tab = 'referee';
  } else if (!SHARED && (hash === '#admin' || params.get('admin') === '1') && sessionStorage.getItem('pb-admin-auth') === 'true') {
    ADMIN = true;
    MODE = 'admin';
  } else {
    ADMIN = false;
    MODE = 'view';
    if (tab === 'setup' || tab === 'referee') tab = 'sched';
  }
  ROUTED = true;
}
parseRoute();

// Kiểm tra link có dùng được không (mở trực tiếp file trên máy thì không chia sẻ được)
function linkOk() {
  if (window.location.protocol === 'file:') {
    showToast('Bạn đang mở file trực tiếp từ máy nên link không dùng được. Hãy đưa file lên web (GitHub Pages, Netlify...) rồi mở bằng link https.', '⚠️');
    return false;
  }
  if (!S.started) {
    showToast('Hãy tạo lịch thi đấu trước khi chia sẻ link.', '⚠️');
    return false;
  }
  return true;
}

// Mã kết quả: trọng tài gửi lại cho BTC các trận đã chấm
function resCode() {
  const out = {};
  Object.keys(CH).forEach(id => { if (SC[id]) out[id] = SC[id]; });
  return b64enc({ t: SNAP_T, SC: out });
}

function applyResults(code) {
  try {
    const p = b64dec(code);

}

function fit() {

  const tot = S.sizes.reduce((a, b) => a + b, 0);
  while (S.pool.length < tot) S.pool.push(['', '']);
  S.pool.length = tot;
  if (S.ord.length !== tot) S.ord = [...Array(tot).keys()];
}

function applyScores() {

function schedule() {
  S.matches = [];
  for (let k = 0; k < S.g; k++) {
    let a = S.teams.map((_, i) => i).filter(i => S.tg[i] === k);
    if (a.length % 2) a.push(-1);
    const m = a.length;
    for (let r = 0; r < m - 1; r++) {
      for (let i = 0; i < m / 2; i++) {

        if (x >= 0 && y >= 0) S.matches.push({ g: k, a: x, b: y, r: r + 1, sa: null, sb: null });

// -------------------------------------------------------------
// THUẬT TOÁN XẾP HẠNG BẢNG ĐẤU 5 BƯỚC CHUẨN
// 1) Điểm thắng (Wins)
// 2) Hiệu số điểm thắng/thua toàn giải (Point Diff)
// 3) Đối đầu (Head to Head - Áp dụng khi CHÍNH XÁC 2 ĐỘI BẰNG ĐIỂM HÒA CHỈ SỐ)
// 4) Tổng điểm thắng toàn giải (Total Points Scored)
// 5) Bốc thăm / Tùy chỉnh thủ công
// -------------------------------------------------------------
function stand(k) {
  const mem = S.teams.map((_, i) => i).filter(i => S.tg[i] === k);
  const by = {};
  const t = mem.map(i => by[i] = { i, p: 0, w: 0, l: 0, pf: 0, pa: 0, d: 0 });
  const ms = S.matches.filter(m => m.g === k && done(m));

  ms.forEach(m => {
    const A = by[m.a], B = by[m.b];
    if (!A || !B) return;
    A.p++; B.p++;
    A.pf += m.sa; A.pa += m.sb;
    B.pf += m.sb; B.pa += m.sa;
    if (m.sa > m.sb) { A.w++; B.l++; } else { B.w++; A.l++; }
  });

  t.forEach(x => x.d = x.pf - x.pa);

  t.sort((x, y) => {
    if (y.w !== x.w) return y.w - x.w; // 1. Số trận thắng
    if (y.d !== x.d) return y.d - x.d; // 2. Hiệu số toàn giải

    // 3. Đối đầu (chỉ xét khi có đúng 2 đội)
    const tieGroup = t.filter(o => o.w === x.w && o.d === x.d);
    if (tieGroup.length === 2) {
      const headMatch = ms.find(m => (m.a === x.i && m.b === y.i) || (m.a === y.i && m.b === x.i));
      if (headMatch) {
        const winner = headMatch.sa > headMatch.sb ? headMatch.a : headMatch.b;
        if (winner === x.i) return -1;
        if (winner === y.i) return 1;
      }
    }

    if (y.pf !== x.pf) return y.pf - x.pf; // 4. Tổng điểm thắng toàn giải

    // 5. Bốc thăm / Thứ tự thủ công do Admin điều chỉnh
    const key = k + '_' + x.i, keyY = k + '_' + y.i;
    const manualX = S.manualRank[key] ?? 0;
    const manualY = S.manualRank[keyY] ?? 0;
    return manualX - manualY;
  });

  t.forEach((x, n) => {
    if (!n) { x.why = ''; return; }
    const p = t[n - 1];
    if (p.w !== x.w) x.why = 'Điểm thắng';
    else if (p.d !== x.d) x.why = 'Hiệu số toàn giải';
    else {
      const headMatch = ms.find(m => (m.a === x.i && m.b === p.i) || (m.a === p.i && m.b === x.i));
      if (headMatch && done(headMatch)) x.why = 'Đối đầu (2 đội)';
      else if (p.pf !== x.pf) x.why = 'Tổng điểm thắng';
      else x.why = 'Bốc thăm / Thủ công';
    }
  });

  return t;
}

const allDone = () => S.matches.length > 0 && S.matches.every(done);

function qual(sr) {
  const lo = sr === 'A' ? 0 : S.advA;
  const hi = sr === 'A' ? S.advA : S.advA + S.advB;
  const out = [];
  for (let k = 0; k < S.g; k++) {
    stand(k).forEach((x, n) => {
      if (n >= lo && n < hi) out.push({ i: x.i, rk: n, w: x.w, d: x.d, pf: x.pf });
    });
  }
  return out.sort((x, y) => x.rk - y.rk || y.w - x.w || y.d - x.d || y.pf - x.pf).map(x => x.i);
}

function winner(m) {
  if (m.bye) return m.a != null ? m.a : m.b;
  return done(m) && m.a != null && m.b != null ? (m.sa > m.sb ? m.a : m.b) : null;
}

function bracketRaw(sr) {
  const seeds = qual(sr), n = seeds.length;
  if (n < 2) return null;
  let P = 1; while (P < n) P *= 2;
  let ord = [1];
  while (ord.length < P) {
    const m = ord.length * 2;
    ord = ord.flatMap(x => [x, m + 1 - x]);
  }
  const get = (r, i) => S.ko[sr][r + '-' + i] || {};
  let cur = [];
  for (let i = 0; i < P / 2; i++) {
    const x = ord[2 * i], y = ord[2 * i + 1];
    const a = x <= n ? seeds[x - 1] : null;
    const b = y <= n ? seeds[y - 1] : null;
    cur.push({ a, b, bye: a == null || b == null, key: '0-' + i, ...get(0, i) });
  }
  // Tránh gặp lại đội cùng bảng ngay vòng đầu: hoán đổi đối thủ giữa các cặp nếu có thể
  const sg = i => (i == null ? -1 : S.tg[i]);
  const fresh = m => m.sa == null && m.sb == null;
  for (let i = 0; i < cur.length; i++) {
    const x = cur[i];
    if (x.bye || sg(x.a) !== sg(x.b) || !fresh(x)) continue;
    for (let j = 0; j < cur.length; j++) {
      const y = cur[j];
      if (j === i || y.bye || !fresh(y)) continue;
      if (sg(x.a) !== sg(y.b) && sg(y.a) !== sg(x.b)) { const t = x.b; x.b = y.b; y.b = t; break; }
    }
  }
  const rounds = [cur];
  for (let r = 1; cur.length > 1; r++) {
    const nx = [];
    for (let i = 0; i < cur.length / 2; i++) {
      nx.push({ a: winner(cur[2 * i]), b: winner(cur[2 * i + 1]), key: r + '-' + i, ...get(r, i) });
    }
    rounds.push(nx); cur = nx;
  }
  rounds.forEach(R => {
    const c = R.length;
    R.nm = c === 1 ? 'Chung kết' : c === 2 ? 'Bán kết' : c === 4 ? 'Tứ kết' : 'Vòng loại 1/' + c;
    R.rk = c === 1 ? 'f' : 'ko';
  });
  return rounds;
}

// Ước lượng số lượt đấu vòng bảng để hiển thị ở phần thiết lập
function courtEstimate() {
  const C = Math.max(1, S.courts | 0);
  const total = S.sizes.reduce((t, n) => t + n * (n - 1) / 2, 0);
  const rounds = Math.max(...S.sizes.map(n => (n % 2 ? n : n - 1)));
  const lb = Math.max(Math.ceil(total / C), rounds);
  return `Vòng bảng có ${total} trận, dùng ${C} sân → dự kiến khoảng ${lb} lượt đấu. Các bảng được xếp đấu song song; vòng sau cũng tự chia sân.`;
}

// Xếp lịch vòng bảng vào sân: các bảng đấu song song, ít lượt nhất, hạn chế đấu liên tiếp.
// Chạy nhiều phương án (có xáo trộn nhẹ) và chọn phương án tốt nhất.
function courtSched() {
  const C = Math.max(1, S.courts | 0), ms = S.matches, N = ms.length;
  const rng = seed => () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  let best = null;
  const runs = N > 150 ? 40 : 300;
  for (let run = 0; run < runs; run++) {
    const rnd = rng(1000 + run * 7919), jit = run === 0 ? 0 : 1;
    let rest = ms.map((_, i) => i), slot = 0;
    const last = {}, cnt = {}, gc = {}, asg = new Array(N), gEnd = {};
    let b2b = 0;
    while (rest.length) {
      const used = new Set(), picks = [];
      while (picks.length < C) {
        let bi = -1, bs = Infinity;
        for (const i of rest) {
          const m = ms[i];
          if (used.has(m.a) || used.has(m.b)) continue;
          const tired = (last[m.a] === slot - 1) + (last[m.b] === slot - 1);
          const sc = tired * 40 + ((cnt[m.a] || 0) + (cnt[m.b] || 0)) * 6 + (gc[m.g] || 0) * 2 + m.r * 0.01 + jit * rnd() * 8;
          if (sc < bs) { bs = sc; bi = i; }
        }
        if (bi < 0) break;
        const m = ms[bi];
        used.add(m.a); used.add(m.b); picks.push(bi);
        gc[m.g] = (gc[m.g] || 0) + 1;
        rest = rest.filter(x => x !== bi);
      }
      if (!picks.length) break;
      picks.forEach(i => {
        const m = ms[i];
        b2b += (last[m.a] === slot - 1) + (last[m.b] === slot - 1);
        asg[i] = slot; gEnd[m.g] = slot;
      });
      picks.forEach(i => {
        const m = ms[i];
        last[m.a] = last[m.b] = slot;
        cnt[m.a] = (cnt[m.a] || 0) + 1; cnt[m.b] = (cnt[m.b] || 0) + 1;
      });
      slot++;
    }
    const ends = Object.values(gEnd);
    const spread = ends.length ? Math.max(...ends) - Math.min(...ends) : 0;
    const cost = slot * 10000 + b2b * 100 + spread * 30;
    if (!best || cost < best.cost) best = { cost, asg, slots: slot };
  }
  // Gán số sân trong từng lượt: gom theo bảng để mỗi bảng thường ở cạnh nhau
  for (let k = 0; k < best.slots; k++) {
    const idx = ms.map((m, i) => i).filter(i => best.asg[i] === k).sort((x, y) => ms[x].g - ms[y].g || ms[x].r - ms[y].r);
    idx.forEach((i, c) => { ms[i].slot = k; ms[i].court = c + 1; });
  }
  S.nslots = best.slots;
}

// Xếp sân cho vòng loại trực tiếp: các seri chạy song song, vòng sau nối tiếp vòng trước
function koPlan() {
  const C = Math.max(1, S.courts | 0);
  const br = { A: bracketRaw('A'), B: S.advB > 0 ? bracketRaw('B') : null };
  const maxL = Math.max(br.A ? br.A.length : 0, br.B ? br.B.length : 0);
  const stages = [];
  const third3 = [];
  ['A', 'B'].forEach(sr => {
    const b = br[sr];
    if (b && b.length >= 2 && b[b.length - 2].length === 2 && !b[b.length - 2].some(m => m.bye)) third3.push([sr, 't']);
  });
  for (let d = maxL - 1; d >= 0; d--) {
    if (d === 0 && third3.length) stages.push(third3);
    const items = [];
    ['A', 'B'].forEach(sr => {
      const b = br[sr];
      if (!b) return;
      const ri = b.length - 1 - d;
      if (ri < 0) return;
      b[ri].forEach(m => { if (!m.bye) items.push([sr, m.key]); });
    });
    stages.push(items);
  }
  const plan = {};
  let turn = S.nslots || 0;
  stages.forEach(items => {
    for (let k = 0; k < items.length; k += C) {
      turn++;
      items.slice(k, k + C).forEach(([sr, key], j) => { plan[sr + '|' + key] = { court: j + 1, turn }; });
    }
  });
  return plan;
}

function groupsOf() {
  let p = 0;
  return S.sizes.map(z => {
    const a = S.ord.slice(p, p + z).map(j => S.pool[j]);
    p += z; return a;
  });
}

// Bảng đấu kèm sân & lượt đấu tự động (sân nhập tay của BTC được ưu tiên)
function bracket(sr) {
  const br = bracketRaw(sr);
  if (!br) return null;
  const plan = koPlan();

    const pl = plan[sr + '|' + m.key];
    if (pl) { m.court = m.court ?? pl.court; m.turn = pl.turn; m.autoCourt = pl.court; }
  }));
  return br;
}

}

// ---------------- SƠ ĐỒ SÂN PICKLEBALL CHO TRỌNG TÀI ----------------
function teamPlayers(idx) {
  const dbl = S.mode === 'double';
  let p = String(S.teams[idx] ?? '').split(' / ').map(x => x.trim()).filter(Boolean);
  if (dbl) { while (p.length < 2) p.push('VĐV ' + (p.length + 1)); return p.slice(0, 2); }
  return [p[0] || 'VĐV'];
}
const shortName = n => { n = String(n); if (n.length <= 11) return n; const w = n.split(/\s+/); return w[w.length - 1].slice(0, 11); };

// Vị trí VĐV theo luật: người giao đứng ô theo vị trí hiện tại, người nhận đứng ô chéo.
// Đánh đôi: ar/br = chỉ số VĐV đang đứng ô PHẢI của mỗi đội; si = chỉ số người đang giao.
function courtState(m) {
  const dbl = S.mode === 'double';
  const hasSv = !!m.sv, sv = m.sv || 'a';
  const rightIdx = { a: m.ar ?? 0, b: m.br ?? 0 };
  const score = { a: m.sa ?? 0, b: m.sb ?? 0 };
  let svCourt = 'R';
  if (dbl) {
    const si = m.si ?? rightIdx[sv];
    svCourt = rightIdx[sv] === si ? 'R' : 'L';
  } else {
    svCourt = score[sv] % 2 === 0 ? 'R' : 'L';   // đánh đơn: điểm chẵn → phải, lẻ → trái
  }
  const out = [];
  ['a', 'b'].forEach(t => {
    const names = teamPlayers(t === 'a' ? m.a : m.b);
    names.forEach((nm, idx) => {
      const court = dbl ? (idx === rightIdx[t] ? 'R' : 'L') : (hasSv ? svCourt : 'R');
      let role = '';
      if (hasSv) {
        if (t === sv) { if (!dbl || idx === (m.si ?? rightIdx[sv])) role = 'server'; }
        else if (!dbl || court === svCourt) role = 'receiver';
      }
      out.push({ t, idx, name: nm, court, role });
    });
  });
  return out;
}

// Tách tên VĐV thành tối đa 2 dòng (ngắt theo từ) để hiện đầy đủ trên sơ đồ
function nameLines(n) {
  n = String(n).trim();
  const w = n.split(/\s+/);
  if (n.length <= 14 || w.length < 2) return [n];
  let best = null;
  for (let k = 1; k < w.length; k++) {
    const l1 = w.slice(0, k).join(' '), l2 = w.slice(k).join(' ');
    const mx = Math.max(l1.length, l2.length);
    if (!best || mx < best.mx) best = { mx, lines: [l1, l2] };
  }
  return best.lines;
}

function courtSvg(m, at, editTeam) {
  const X0 = 20, X1 = 420, Y0 = 106, Y1 = 306, NX = 220, KL = 156.4, KR = 283.6, YM = 206;
  const leftKey = m.sw ? 'b' : 'a', rightKey = m.sw ? 'a' : 'b';
  const dbl = S.mode === 'double';
  const st = courtState(m);
  const sv = m.sv, hasSv = !!m.sv;
  const spot = (t, court) => {
    const left = t === leftKey;
    const cx = left ? (X0 + KL) / 2 : (KR + X1) / 2;
    const top = left ? court === 'L' : court === 'R';
    return [cx, top ? (Y0 + YM) / 2 : (YM + Y1) / 2];
  };
  let g = '';
  ['a', 'b'].forEach(t => {
    const mine = st.filter(p => p.t === t);
    const inner = mine.map(p => {
      const [cx, cy0] = spot(t, p.court);
      const cy = cy0 - 20;                       // tâm vòng tròn VĐV
      const col = p.role === 'server' ? '#fbbf24' : p.role === 'receiver' ? '#22d3ee' : '#e2e8f0';
      const tx = p.role === 'server' ? '#fde047' : p.role === 'receiver' ? '#67e8f9' : '#ffffff';
      const lines = nameLines(p.name);
      const fs = Math.max(9, Math.min(14, Math.round(124 / (Math.max(...lines.map(x => x.length)) * 0.6))));
      const ring = editTeam === t ? `<circle cx="${cx}" cy="${cy}" r="23" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="4 3"/>` : '';
      const ball = p.role === 'server' ? `<circle cx="${cx + 17}" cy="${cy - 17}" r="7.5" fill="#fef08a" stroke="#a16207" stroke-width="1.6"/><circle cx="${cx + 15}" cy="${cy - 18.5}" r="1.1" fill="#a16207"/><circle cx="${cx + 19.5}" cy="${cy - 15.5}" r="1.1" fill="#a16207"/><circle cx="${cx + 15.5}" cy="${cy - 14}" r="1.1" fill="#a16207"/>` : '';
      const txt = lines.map((ln, k) => `<text x="${cx}" y="${cy + 33 + k * (fs + 3)}" text-anchor="middle" font-size="${fs}" font-weight="${p.role ? 800 : 700}" fill="${tx}" stroke="#0f172a" stroke-width="0.4" paint-order="stroke">${e(ln)}</text>`).join('');
      return `${ring}<circle cx="${cx}" cy="${cy}" r="17" fill="${col}" stroke="#0f172a" stroke-width="1.6"/>
        <text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">${e(String(p.name).charAt(0).toUpperCase())}</text>${ball}${txt}`;
    }).join('');
    g += dbl ? `<g data-swap="${t}" ${at} style="cursor:${editTeam === t ? 'pointer' : 'default'}">${inner}</g>` : `<g>${inner}</g>`;
  });

  // Phần đầu: tên đội (mỗi VĐV một dòng) + điểm số lớn cho từng bên
  const head = (t, x) => {
    const idx = t === 'a' ? m.a : m.b;
    const pl = teamPlayers(idx);
    const isSv = hasSv && sv === t;
    const nmTxt = pl.map((nm, k) => {
      const fs = Math.max(9, Math.min(15, 200 / (String(nm).length * 0.6)));
      return `<text x="${x}" y="${29 + k * 16}" text-anchor="middle" font-size="${fs.toFixed(1)}" font-weight="800" class="fill-slate-800 dark:fill-slate-100">${e(nm)}</text>`;
    }).join('');
    const scY = pl.length > 1 ? 92 : 80;
    return `
      <text x="${x}" y="12" text-anchor="middle" font-size="11" font-weight="800" class="fill-slate-400">ĐỘI ${t === 'a' ? '1' : '2'} ${t === leftKey ? '◀' : '▶'}${isSv ? ' · ĐANG GIAO' : ''}</text>
      ${nmTxt}
      <text x="${x}" y="${scY}" text-anchor="middle" font-size="50" font-weight="900" class="${isSv ? 'fill-amber-500' : 'fill-slate-800 dark:fill-slate-100'}">${t === 'a' ? (m.sa ?? 0) : (m.sb ?? 0)}</text>`;
  };
  const lx = (X0 + NX) / 2, rx = (NX + X1) / 2;
  return `
  <svg viewBox="0 0 440 322" class="w-full h-auto select-none" role="img" aria-label="Sơ đồ sân pickleball">
    ${head(leftKey, lx)}${head(rightKey, rx)}
    <rect x="${X0 - 8}" y="${Y0 - 8}" width="${X1 - X0 + 16}" height="${Y1 - Y0 + 16}" rx="10" fill="#1e3a5f"/>
    <rect x="${X0}" y="${Y0}" width="${X1 - X0}" height="${Y1 - Y0}" fill="#2b6cb0"/>
    <rect x="${KL}" y="${Y0}" width="${KR - KL}" height="${Y1 - Y0}" fill="#2c5282"/>
    <g stroke="#fff" stroke-width="2.2" fill="none">
      <rect x="${X0}" y="${Y0}" width="${X1 - X0}" height="${Y1 - Y0}"/>
      <line x1="${KL}" y1="${Y0}" x2="${KL}" y2="${Y1}"/><line x1="${KR}" y1="${Y0}" x2="${KR}" y2="${Y1}"/>
      <line x1="${X0}" y1="${YM}" x2="${KL}" y2="${YM}"/><line x1="${KR}" y1="${YM}" x2="${X1}" y2="${YM}"/>
    </g>
    <line x1="${NX}" y1="${Y0 - 8}" x2="${NX}" y2="${Y1 + 8}" stroke="#f8fafc" stroke-width="4" stroke-dasharray="3 3"/>
    <g font-size="9" fill="#fff" opacity="0.55" font-weight="700">
      <text x="${X0 + 6}" y="${Y0 + 13}">TRÁI</text><text x="${X0 + 6}" y="${YM + 13}">PHẢI</text>
      <text x="${KR + 6}" y="${Y0 + 13}">PHẢI</text><text x="${KR + 6}" y="${YM + 13}">TRÁI</text>
      <text x="${(KL + NX) / 2}" y="${(Y0 + Y1) / 2 + 3}" text-anchor="middle">BẾP</text><text x="${(NX + KR) / 2}" y="${(Y0 + Y1) / 2 + 3}" text-anchor="middle">BẾP</text>
    </g>
    ${g}
  </svg>`;
}

              <th class="p-2 text-center">#</th>
              <th class="p-2">Đội</th>
              <th class="p-2 text-center">Trận</th>
              <th class="p-2 text-center">T</th>
              <th class="p-2 text-center">B</th>
              <th class="p-2 text-center">ĐIỂM</th>
              <th class="p-2 text-center">HS</th>
              <th class="p-2 text-center">ĐT</th>
              <th class="p-2">Phân hạng</th>
            </tr>
          </thead>
          <tbody>
            ${st.map((r, n) => `
              <tr class="border-b border-slate-100 dark:border-slate-800 ${n < A ? 'bg-emerald-50/50 dark:bg-emerald-950/20 font-bold' : ''}">
                <td class="p-2 text-center font-bold">${n + 1}${n < A ? ' 🅐' : n < B ? ' 🅑' : ''}</td>
                <td class="p-2 font-semibold text-slate-800 dark:text-slate-200">${T(r.i)}</td>
                <td class="p-2 text-center">${r.p}</td>
                <td class="p-2 text-center text-emerald-600">${r.w}</td>
                <td class="p-2 text-center text-red-500">${r.l}</td>
                <td class="p-2 text-center font-extrabold text-brand-600 dark:text-brand-400 text-base">${r.w}</td>
                <td class="p-2 text-center font-bold ${r.d > 0 ? 'text-emerald-600' : r.d < 0 ? 'text-red-500' : ''}">${r.d > 0 ? '+' : ''}${r.d}</td>
                <td class="p-2 text-center text-slate-500">${r.pf}</td>
                <td class="p-2 text-xs text-slate-400">
                  ${r.why}
                  ${ADMIN && r.why.includes('Bốc thăm') ? `
                    <div class="inline-flex gap-1 ml-1">
                      <button data-rank-up="${k}_${r.i}" class="px-1.5 py-0.5 bg-slate-200 dark:bg-slate-700 rounded hover:bg-brand-500 hover:text-white">▲</button>
                      <button data-rank-down="${k}_${r.i}" class="px-1.5 py-0.5 bg-slate-200 dark:bg-slate-700 rounded hover:bg-brand-500 hover:text-white">▼</button>
                    </div>
                  ` : ''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }
  return h;
}

function third(sr, br) {
  if (!br || br.length < 2) return null;
  const sf = br[br.length - 2];
  if (sf.length !== 2 || sf.some(m => m.bye)) return null;
  const lose = m => (done(m) && m.a != null && m.b != null ? (m.sa > m.sb ? m.b : m.a) : null);
  const t = { a: lose(sf[0]), b: lose(sf[1]), key: 't', ...((S.ko[sr] || {})['t'] || {}) };
  const pl = koPlan()[sr + '|t'];
  if (pl) { t.court = t.court ?? pl.court; t.turn = pl.turn; t.autoCourt = pl.court; }
  return t;
}

function vRound(sr) {
  if (!S.started) return '<div class="p-8 text-center text-slate-500 bg-card rounded-2xl border border-slate-200 dark:border-slate-800">Chưa có lịch đấu.</div>';
  if (sr !== 'A' && sr !== 'B') return '';
  const lo = sr === 'A' ? 1 : S.advA + 1;
  const hi = sr === 'A' ? S.advA : S.advA + S.advB;
  const seeds = qual(sr);
  const head = `
    <div class="bg-gradient-to-r ${sr === 'A' ? 'from-amber-500 to-orange-500' : 'from-slate-500 to-slate-700'} text-white p-4 rounded-2xl shadow">
      <div class="text-xs font-bold uppercase tracking-widest opacity-90">Vòng loại trực tiếp</div>
      <div class="text-xl font-black">${sr === 'A' ? '🥇' : '🥈'} SERI ${sr}</div>
      <div class="text-xs opacity-90">Các đội xếp hạng ${lo}${hi > lo ? ' – ' + hi : ''} của mỗi bảng · ${seeds.length} đội</div>
    </div>`;

  if (!allDone()) {
    const left = S.matches.filter(m => !done(m)).length;
    return head + `<div class="p-6 text-center text-slate-500 bg-card rounded-2xl border border-slate-200 dark:border-slate-800">⏳ Vòng bảng còn <b>${left}</b> trận chưa kết thúc.<br><span class="text-xs">Nhánh đấu sẽ tự động xếp khi hoàn tất toàn bộ vòng bảng.</span></div>`;
  }
  const br = bracket(sr);
  if (!br) return head + '<div class="p-6 text-center text-slate-500 bg-card rounded-2xl border border-slate-200 dark:border-slate-800">Không đủ đội để tổ chức vòng loại trực tiếp cho Seri này.</div>';

  let h = head;
  const fin = br[br.length - 1][0];
  const th = third(sr, br);
  const champ = winner(fin);
  if (champ != null) {
    const runner = fin.a === champ ? fin.b : fin.a;
    const t3 = th && winner(th) != null ? winner(th) : null;
    const t4 = t3 != null ? (th.a === t3 ? th.b : th.a) : null;
    h += `
      <div class="bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-300 dark:border-emerald-800 p-4 rounded-2xl space-y-1">
        <div class="font-black text-emerald-700 dark:text-emerald-300">🏆 KẾT QUẢ SERI ${sr}</div>
        <div class="text-sm">🥇 Nhất: <b>${T(champ)}</b></div>
        <div class="text-sm">🥈 Nhì: <b>${T(runner)}</b></div>
        ${t3 != null ? `<div class="text-sm">🥉 Ba: <b>${T(t3)}</b></div><div class="text-sm">4️⃣ Tư: <b>${T(t4)}</b></div>` : ''}
      </div>`;
  }
  br.forEach(R => {
    h += `
      <div class="bg-card p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
        <h3 class="font-extrabold text-sm text-slate-700 dark:text-slate-300 flex items-center justify-between">
          <span>${R.nm.toUpperCase()}</span>
          <span class="text-xs font-normal text-slate-400">${R.filter(m => !m.bye).length} trận</span>
        </h3>
        <div class="space-y-2.5">
          ${R.map((m, idx) => matchRow(m, sr, m.key, R.rk, `${R.nm} · Trận ${idx + 1}${m.turn ? ' · Lượt ' + m.turn : ''}${m.court ? ' · Sân ' + m.court : ''}`)).join('')}
        </div>
      </div>`;
  });
  if (th) {
    h += `
      <div class="bg-card p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
        <h3 class="font-extrabold text-sm text-slate-700 dark:text-slate-300">TRANH HẠNG 3 – 4</h3>
        ${matchRow(th, sr, 't', 'ko', `Tranh hạng 3${th.turn ? ' · Lượt ' + th.turn : ''}${th.court ? ' · Sân ' + th.court : ''}`)}
      </div>`;
  }
  return h;
}

// -------------------------------------------------------------
// HÀM RENDER CHÍNH HIỂN THỊ TOÀN BỘ GIAO DIỆN
// -------------------------------------------------------------
function render() {
  parseRoute();

  const adminBtn = document.getElementById('btn-admin-toggle');
  if (adminBtn) adminBtn.classList.toggle('hidden', SHARED);
  const shareBtn = document.getElementById('btn-share-view');
  if (shareBtn) shareBtn.classList.toggle('hidden', SHARED);

  const nm = document.getElementById('name');
  if (nm) {
    nm.value = S.name;
    nm.disabled = !ADMIN;
  }

  updateBadge();

  const subInfo = document.getElementById('sub-info');
  if (subInfo) {
    subInfo.innerText = [S.date, S.loc].filter(Boolean).join(' · ');
  }

  const N0 = ADMIN ? [
    ['setup', BALL + ' Thiết lập'],
    ['sched', '📅 Lịch đấu'],
    ['rank', '🏆 Bảng xếp hạng']
  ] : MODE === 'referee' ? [
    ['referee', BALL + ' Bàn Trọng Tài'],
    ['sched', '📅 Lịch đấu'],
    ['rank', '🏆 Bảng xếp hạng']
  ] : [
    ['sched', '📅 Lịch đấu'],
    ['rank', '🏆 Bảng xếp hạng']
  ];
  const KT = S.started ? [['A', '🥇 Seri A']].concat(S.advB > 0 ? [['B', '🥈 Seri B']] : []) : [];
  const N = N0.concat(KT);
  if ((tab === 'A' || tab === 'B') && !KT.some(x => x[0] === tab)) tab = 'sched';

  const nav = document.getElementById('nav');
  if (nav) {
    nav.innerHTML = N.map(([k, l]) => `
      <button data-tab="${k}" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all ${tab === k ? 'bg-brand-600 text-white shadow-md' : 'bg-card text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800'}">
        ${l}
      </button>
    `).join('');
  }

  const view = document.getElementById('view');
  if (view && SNAP_ERR) {
    view.innerHTML = `
      <div class="bg-card p-6 rounded-2xl border border-slate-200 dark:border-slate-800 text-center space-y-3">
        <div class="text-4xl">⚠️</div>
        <h3 class="font-extrabold text-base text-red-500">Link không hợp lệ hoặc bị cắt mất một phần.</h3>
        <p class="text-xs text-slate-500">Vui lòng nhờ Ban tổ chức gửi lại link (nên gửi nguyên link, không chỉnh sửa).</p>
      </div>`;
  } else if (view) {
    if (MODE === 'referee' && tab === 'referee') {
      view.innerHTML = vReferee();
    } else {
      view.innerHTML = ({ setup: vSetup, sched: vSched, rank: vRank }[tab] || (() => vRound(tab)))();
    }
  }
}

// -------------------------------------------------------------
// XỬ LÝ SỰ KIỆN CLICK & INTERACTION
// -------------------------------------------------------------
document.addEventListener('click', ev => {
  const btn = ev.target.closest('button');

  // Người xem không được chấm điểm / chỉnh sửa gì cả
  if (btn && (btn.dataset.first || btn.dataset.sn || btn.dataset.rally || btn.dataset.undo || btn.dataset.sc || btn.dataset.swapends || btn.dataset.posedit || btn.dataset.startp != null || btn.dataset.preTeam || btn.dataset.preBack || btn.dataset.restart || btn.dataset.si || btn.dataset.refW != null || btn.dataset.tgl) && !(ADMIN || (MODE === 'referee' && btn.dataset.refW == null && !btn.dataset.tgl))) return;

  // Nút sao chép link Trọng Tài
  if (btn && btn.dataset.refW != null) {
    if (!linkOk()) return;
    copyText(`${getBaseUrl()}?role=referee&ref_w=${btn.dataset.refW}&ref_i=${btn.dataset.refI}${syncQS()}&d=${snapParam()}`);
    return;
  }

  if (btn && btn.id === 'btn-share-view') {
    if (!linkOk()) return;
    copyText(`${getBaseUrl()}?${syncQS().slice(1)}${syncOn() ? '&' : ''}d=${snapParam()}`);
    return;
  }

  // Trọng tài gửi kết quả về cho BTC
  if (btn && btn.dataset.sendRes) {
    if (window.location.protocol === 'file:') { linkOk(); return; }
    const url = `${getBaseUrl()}?res=${resCode()}`;
    if (navigator.share) {
      navigator.share({ title: 'Kết quả trận đấu', url }).catch(() => copyText(url));
    } else {
      copyText(url);
    }
    return;
  }

  if (btn && btn.id === 'res-apply') {
    const v = (document.getElementById('res-paste').value || '').trim();
    const mm = /[?&]res=([A-Za-z0-9_-]+)/.exec(v);
    if (v) applyResults(mm ? mm[1] : v);
    return;
  }

  if (btn && btn.id === 'btn-admin-toggle') {
    if (ADMIN) {
      sessionStorage.removeItem('pb-admin-auth');
      window.location.hash = '#view';
      showToast('Đã thoát quyền Admin', '🔒');
      render();
    } else {
      document.getElementById('pass-modal').classList.remove('hidden');
      document.getElementById('pass-input').focus();
    }
    return;
  }

  if (btn && btn.id === 'btn-theme') {
    document.documentElement.classList.toggle('dark');
    return;
  }

  if (btn && btn.dataset.tab) {
    tab = btn.dataset.tab;
    render();
    return;
  }

  if (btn && btn.dataset.tgl) {
    OPEN[btn.dataset.tgl] = !OPEN[btn.dataset.tgl];
    render();
    return;
  }

  // Trọng tài: đổi chỗ phải/trái của VĐV trong đội (chạm vào sơ đồ sân)
  const swEl = ev.target.closest && ev.target.closest('[data-swap]');
  if (swEl) {
    if (!(ADMIN || MODE === 'referee')) return;
    const g = getM(swEl.dataset.w, swEl.dataset.i);
    if (!g || !g.m) return;
    const m = g.m;
    const cur = m.sv || PRE[swEl.dataset.w + '|' + swEl.dataset.i];
    if (!cur) { showToast('Hãy chọn đội giao bóng đầu tiên trước.', 'ℹ️'); return; }
    if (swEl.dataset.swap === cur) { showToast('Vị trí đội giao bóng tự đổi theo luật. Chỉ sửa được vị trí đội đỡ giao.', 'ℹ️'); return; }
    if (m.sv && !POSEDIT) { showToast('Bấm "Sửa vị trí đội đỡ giao" nếu cần đổi chỗ.', 'ℹ️'); return; }
    if (m.sv && m.st !== 'live' && done(m)) return;
    putScore(swEl.dataset.w, swEl.dataset.i, swEl.dataset.swap === 'a' ? { ar: 1 - (m.ar ?? 0) } : { br: 1 - (m.br ?? 0) });
    return;
  }
  if (btn && btn.dataset.posedit) { POSEDIT = !POSEDIT; render(); return; }
  if (btn && btn.dataset.swapends) {
    const g = getM(btn.dataset.w, btn.dataset.i);
    if (!g || !g.m) return;
    putScore(btn.dataset.w, btn.dataset.i, { sw: g.m.sw ? 0 : 1 });
    showToast('Đã đổi sân: hai đội đổi bên.', '🔄');
    return;
  }

  // Trọng tài: chọn đội giao đầu tiên (bước 1) -> VĐV giao đầu tiên (bước 2)
  if (btn && btn.dataset.preTeam) { PRE[btn.dataset.w + '|' + btn.dataset.i] = btn.dataset.preTeam; render(); return; }
  if (btn && btn.dataset.restart) {
    const w = btn.dataset.w, i = btn.dataset.i, g = getM(w, i);
    if (!g || !g.m) return;
    const m = g.m, key = w + '|' + i, played = (m.sa ?? 0) + (m.sb ?? 0) > 0;
    if (played && !(RESTART_ARM[key] && Date.now() - RESTART_ARM[key] < 4000)) {
      RESTART_ARM[key] = Date.now();
      showToast('Trận đã có điểm. Bấm lần nữa trong 4 giây để chọn lại người giao (điểm giữ nguyên).', '⚠️');
      return;
    }
    delete RESTART_ARM[key]; delete PRE[key]; delete HIST[key];
    putScore(w, i, played ? { sv: null, sn: null, si: null, st: 'live' } : { sv: null, sn: null, si: null, st: null, sa: null, sb: null });
    showToast('Đã hoàn tác. Hãy chọn lại đội và người giao đầu tiên.', '🔁');
    return;
  }
  if (btn && btn.dataset.preBack) { delete PRE[btn.dataset.w + '|' + btn.dataset.i]; render(); return; }
  if (btn && btn.dataset.startp != null) {
    const w = btn.dataset.w, i = btn.dataset.i, g = getM(w, i);
    if (!g || !g.m) return;
    const m = g.m, dbl = S.mode === 'double', t = btn.dataset.team, idx = +btn.dataset.startp;
    const patch = { sa: m.sa ?? 0, sb: m.sb ?? 0, st: 'live', sv: t, sn: dbl ? ((m.sa ?? 0) + (m.sb ?? 0) === 0 ? 2 : 1) : 1, si: idx };
    if (dbl) patch[t === 'a' ? 'ar' : 'br'] = idx;       // VĐV giao đầu đứng ô phải của đội
    delete PRE[w + '|' + i];
    putScore(w, i, patch);
    return;
  }
  if (btn && btn.dataset.si) {
    const g = getM(btn.dataset.w, btn.dataset.i);
    if (!g || !g.m || !g.m.sv) return;
    const m = g.m, cur = m.si ?? (m.sv === 'a' ? (m.ar ?? 0) : (m.br ?? 0));
    putScore(btn.dataset.w, btn.dataset.i, { si: 1 - cur, st: 'live' });
    return;
  }

  // Trọng tài: chọn đội giao đầu tiên / người giao
  if (btn && btn.dataset.first) {
    const w = btn.dataset.w, i = btn.dataset.i, g = getM(w, i);
    if (!g || !g.m) return;
    const m = g.m, dbl = S.mode === 'double';
    const nt = btn.dataset.first;
    putScore(w, i, { sa: m.sa ?? 0, sb: m.sb ?? 0, st: 'live', sv: nt, sn: m.sn || (dbl ? 2 : 1), si: dbl ? (nt === 'a' ? (m.ar ?? 0) : (m.br ?? 0)) : 0 });
    return;
  }
  if (btn && btn.dataset.sn) {
    const w = btn.dataset.w, i = btn.dataset.i, g = getM(w, i);
    if (!g || !g.m) return;
    putScore(w, i, { sn: +btn.dataset.sn, st: 'live' });
    return;
  }

  // Trọng tài: ghi 1 pha bóng theo luật giao bóng
  if (btn && btn.dataset.rally) {
    const w = btn.dataset.w, i = btn.dataset.i, g = getM(w, i);
    if (!g || !g.m || g.m.st !== 'live') return;
    const m = g.m, dbl = S.mode === 'double', side = btn.dataset.rally;
    let sa = m.sa ?? 0, sb = m.sb ?? 0, sv = m.sv || 'a', sn = m.sn || (dbl ? 2 : 1);
    let ar = m.ar ?? 0, br = m.br ?? 0;
    let si = m.si ?? (sv === 'a' ? ar : br);
    const hid = w + '|' + i;
    HIST[hid] = (HIST[hid] || []).concat([{ sa, sb, sv, sn, ar, br, si }]).slice(-50);
    if (side === sv) {
      if (side === 'a') sa++; else sb++;
      if (dbl) { if (sv === 'a') ar = 1 - ar; else br = 1 - br; }   // ghi điểm: người giao đổi ô với đồng đội, vẫn giao tiếp
    } else if (dbl && sn === 1) {
      sn = 2; si = 1 - si;                                          // giao số 1 lỗi: đồng đội giao tiếp, không đổi ô
    } else {
      sv = sv === 'a' ? 'b' : 'a'; sn = 1;                          // đổi giao: người đứng ô PHẢI của đội kia giao đầu
      si = dbl ? (sv === 'a' ? ar : br) : 0;
    }
    putScore(w, i, { sa, sb, sv, sn, ar, br, si, st: 'live' });
    if (sa !== sb && valid({ sa, sb }, S.rules[g.rk])) showToast('Đã đủ điều kiện thắng! Bấm KẾT THÚC TRẬN để xác nhận.', '🏁');
    return;
  }

  if (btn && btn.dataset.undo) {
    const w = btn.dataset.w, i = btn.dataset.i, hid = w + '|' + i;
    const h = HIST[hid] || [];
    if (!h.length) { showToast('Không còn pha bóng nào để hoàn tác.', 'ℹ️'); return; }
    const prev = h.pop();
    putScore(w, i, { sa: prev.sa, sb: prev.sb, sv: prev.sv, sn: prev.sn, ar: prev.ar, br: prev.br, si: prev.si, st: 'live' });
    return;
  }

  // Điều khiển Tỉ số / Kết thúc trận đấu
  if (btn && btn.dataset.sc) {
    const w = btn.dataset.w, i = btn.dataset.i, action = btn.dataset.sc;
    const g = getM(w, i);
    if (!g || !g.m) return;
    const m = g.m;

    if (action === 'fin') {
      const sa = m.sa ?? 0, sb = m.sb ?? 0;
      if (sa === sb) { showToast('Tỉ số đang hòa, chưa thể kết thúc trận đấu!', '⚠️'); return; }
      if (!valid({ sa, sb }, S.rules[g.rk])) { showToast(`Tỉ số chưa đúng luật (${rt(g.rk)})`, '⚠️'); return; }

      pendingConfirm = { w, i, patch: { sa, sb, st: 'final' } };
      document.getElementById('modal-desc').innerHTML = `Tỉ số chung cuộc: <b class="text-brand-600 font-extrabold text-base">${T(m.a)} (${sa}) - (${sb}) ${T(m.b)}</b>`;
      document.getElementById('confirm-modal').classList.remove('hidden');
      return;
    }

    if (action === 'start' || action === 'open') {
      putScore(w, i, { sa: m.sa ?? 0, sb: m.sb ?? 0, st: 'live' });
      return;
    }

    const sa = m.sa ?? 0, sb = m.sb ?? 0;
    const d = action[1] === '+' ? 1 : -1;
    const patch = action[0] === 'a' ? { sa: Math.max(0, sa + d), sb, st: 'live' } : { sa, sb: Math.max(0, sb + d), st: 'live' };
    putScore(w, i, patch);
    return;
  }

  if (btn && btn.id === 'modal-confirm') {
    if (pendingConfirm) {
      putScore(pendingConfirm.w, pendingConfirm.i, pendingConfirm.patch);
      pendingConfirm = null;
      showToast('Đã ghi nhận kết quả trận đấu!', '✅');
    }
    document.getElementById('confirm-modal').classList.add('hidden');
    return;
  }

  if (btn && btn.id === 'modal-cancel') {
    pendingConfirm = null;
    document.getElementById('confirm-modal').classList.add('hidden');
    return;
  }

  if (btn && btn.id === 'pass-submit') {
    const inputPass = document.getElementById('pass-input').value;
    if (inputPass === S.adminPass) {
      sessionStorage.setItem('pb-admin-auth', 'true');
      document.getElementById('pass-modal').classList.add('hidden');
      document.getElementById('pass-input').value = '';
      document.getElementById('pass-error').classList.add('hidden');
      window.location.hash = '#admin';
      showToast('Đã đăng nhập quyền Admin!', '🔑');
      render();
    } else {
      document.getElementById('pass-error').classList.remove('hidden');
    }
    return;
  }

  if (btn && btn.id === 'pass-cancel') {
    document.getElementById('pass-modal').classList.add('hidden');
    document.getElementById('pass-input').value = '';
    document.getElementById('pass-error').classList.add('hidden');
    return;
  }

  if (!ADMIN) return;

  if (btn && btn.id === 'start') {
    S.teams = []; S.tg = [];
    groupsOf().forEach((grp, k) => grp.forEach((p, i) => { S.teams.push(tn(p, k, i)); S.tg.push(k); }));
    clearScores();
    schedule();
    courtSched();
    S.started = true;
    applyScores();
    persistLocal();
    pushSnapSoon();
    tab = 'sched';
    render();
    return;
  }

  if (btn && btn.id === 'reset') {
    if (!armed) { armed = true; render(); return; }
    clearScores();
    S.started = false;
    S.teams = []; S.tg = []; S.matches = [];
    armed = false;
    persistLocal();
    if (syncOn()) dbReq('/snap', 'DELETE').catch(() => {});
    render();
    return;
  }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (!ADMIN) return;

  if (t.id === 'name') {
    S.name = t.value.trim() || 'Giải Pickleball';
    persistLocal();
    return;
  }

  if (t.dataset.ref) {
    const [k, i] = t.dataset.ref.split('|');
    if (k === 'm') {
      if (S.matches[+i]) S.matches[+i].ref = t.value.trim();
      persistLocal();
      pushSnapSoon();
    } else {
      putScore(k, i, { ref: t.value.trim() });
    }
    return;
  }

  if (t.dataset.kocourt) {
    const [k, i] = t.dataset.kocourt.split('|');
    putScore(k, i, { court: parseInt(t.value, 10) || null });
    return;
  }

  const f = t.dataset.f;
  if (f === 'db') {
    S.db = t.value.trim().replace(/\/+$/, '');
    S.dbOff = !S.db;
    if (S.db && !S.tid) S.tid = Math.random().toString(36).slice(2, 10);
    SYNC = { db: S.db, tid: S.tid };
    persistLocal();
    startStream();
    if (syncOn()) {
      dbReq('/sc', 'PUT', SC).then(() => { setSync(true); showToast('Đã kết nối đồng bộ!', '🟢'); }).catch(() => { setSync(false); showToast('Không kết nối được. Kiểm tra lại địa chỉ Database & Rules.', '⚠️'); });
      if (S.started) pushSnapSoon();
    }
    render();
    return;
  }
  if (f) {
    const p = f.split(':');
    if (p[0] === 'p') {
      S.pool[+p[1]][+p[2]] = t.value.trim();
      persistLocal();
      return;
    }
    if (p[0] === 'sz') {
      S.sizes[+p[1]] = Math.max(2, Math.min(8, parseInt(t.value, 10) || 2));
      fit();
    } else if (['g', 'advA', 'advB', 'courts'].includes(f)) {
      S[f] = +t.value;
      if (f === 'g') fit();
    } else {
      S[f] = t.value;
    }
    persistLocal();
    render();
    return;
  }

  if (t.dataset.k) {
    const v = t.value === '' ? null : Math.max(0, parseInt(t.value, 10) || 0);
    putScore(t.dataset.k, t.dataset.i, { [t.dataset.s]: v, st: 'final' });
  }
});

window.addEventListener('hashchange', render);
setInterval(() => { startStream(); pull(); }, 3000);
startStream();

// Khởi chạy ứng dụng
(function() {
  const res = new URLSearchParams(window.location.search).get('res');
  if (res && !SHARED) {
    applyResults(res);
    try { history.replaceState(null, '', getBaseUrl() + (window.location.hash || '')); } catch (x) {}
  }
})();
render();
pull();
if (!SHARED && syncOn() && S.started) pushSnapSoon();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
